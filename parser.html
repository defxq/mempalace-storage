<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Phone Notes to data.json Converter</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #0f172a; color: #f8fafc; }
        h2 { color: #38bdf8; }
        .container { display: flex; gap: 20px; height: 80vh; }
        textarea { flex: 1; background: #1e293b; color: #fff; border: 1px solid #334155; padding: 15px; border-radius: 6px; font-family: inherit; font-size: 13px; resize: none; }
        .controls { margin-top: 15px; display: flex; gap: 15px; align-items: center; }
        button { background: #38bdf8; color: #020617; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: inherit; }
        button:hover { background: #7dd3fc; }
        input { background: #1e293b; color: white; border: 1px solid #334155; padding: 8px; border-radius: 4px; font-family: inherit; }
    </style>
</head>
<body>

    <h2>⚡ Raw Note Converter Matrix</h2>
    <p>Paste your phone notes on the left, set a target tab name, and click convert to generate production-ready structured json layout.</p>

    <div class="controls">
        <label>Target Tab/Section Name:</label>
        <input type="text" id="tab-name" value="Linux Basics">
        <button onclick="convertNotes()">Convert to JSON ➔</button>
    </div>
    <br>

    <div class="container">
        <textarea id="raw-input" placeholder="Paste your phone notes here... Example:&#10;stat [file|directory]&#10;• Shows stats, used to check hard link&#10;===============================&#10;cd [file|directory]&#10;• Change directory"></textarea>
        <textarea id="json-output" placeholder="Structured data.json output will appear here..." readonly></textarea>
    </div>

    <script>
        function convertNotes() {
            const rawText = document.getElementById('raw-input').value;
            const tabName = document.getElementById('tab-name').value;
            
            // Split entries by looking for blocks of equal signs (====)
            const rawBlocks = rawText.split(/={3,}/);
            const structuredData = [];
            let currentId = 1;

            rawBlocks.forEach(block => {
                // Clean up spacing and split the block into lines
                const lines = block.split('\n').map(line => line.trim()).filter(line => line.length > 0);
                if (lines.length === 0) return;

                // Rule 1: The very first line is always our full execution syntax
                const syntax = lines[0];
                
                // Rule 2: Isolate the base command name (first word of the syntax line)
                const command = syntax.split(' ')[0];

                const flags = [];
                let notesArray = [];

                // Process remaining detail lines
                for (let i = 1; i < lines.length; i++) {
                    let currentLine = lines[i];

                    // Strip out bullet characters if present
                    if (currentLine.startsWith('•')) {
                        currentLine = currentLine.substring(1).trim();
                    }

                    // Look for flags starting with a dash (e.g., "-e allows escape characters")
                    if (currentLine.startsWith('-')) {
                        // Find the first space to split the flag from its description
                        const firstSpaceIndex = currentLine.indexOf(' ');
                        if (firstSpaceIndex !== -1) {
                            const flagName = currentLine.substring(0, firstSpaceIndex);
                            const flagDesc = currentLine.substring(firstSpaceIndex).trim();
                            flags.push({ flag: flagName, desc: flagDesc });
                        } else {
                            flags.push({ flag: currentLine, desc: "Flag enabled." });
                        }
                    } else {
                        // If it doesn't look like a direct flag, treat it as general operational notes
                        notesArray.push(currentLine);
                    }
                }

                // If no specific individual flags were parsed, create a default overview entry
                if (flags.length === 0 && notesArray.length > 0) {
                    flags.push({ flag: "Default", desc: notesArray.join(' ') });
                    notesArray = []; // Cleared out since it was moved to default description
                }

                structuredData.push({
                    id: String(currentId++),
                    tab: tabName,
                    command: command,
                    syntax: syntax,
                    tags: [command.toLowerCase()], // Default tagging to base command name
                    flags: flags,
                    notes: notesArray.join(' ') || "Quick revision template."
                });
            });

            // Format with 2-space indentation for easy code reading
            document.getElementById('json-output').value = JSON.stringify(structuredData, null, 2);
        }
    </script>
</body>
</html>
