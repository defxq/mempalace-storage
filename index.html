<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MEMPALACE VAULT VIEWER</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- SETTINGS OVERSLIDE PANEL -->
    <div id="drawer-overlay" class="sidebar-overlay" onclick="toggleSidebarMenu(false)"></div>
    <div id="settings-drawer" class="sidebar-drawer">
        <div class="drawer-header">
            <div class="drawer-title">⚙️ SYSTEM CONFIG</div>
            <button type="button" class="close-x-btn" onclick="toggleSidebarMenu(false)">✕ CLOSE</button>
        </div>
        
        <div class="config-row">
            <div class="config-label">Text Scale Config:</div>
            <div class="font-scaler-deck">
                <button type="button" class="scaler-btn" onclick="modifyTextScale(-1)">-</button>
                <div id="scaler-indicator" class="scaler-value-display">16px</div>
                <button type="button" class="scaler-btn" onclick="modifyTextScale(1)">+</button>
            </div>
        </div>

                <div class="config-row">
            <div class="config-label">Active Core Theme:</div>
            <div class="theme-select-deck">
                <button type="button" id="theme-btn-industrial" class="theme-opt-btn active-theme-token" onclick="switchActiveThemeSheet('industrial')">
                    ● INDUSTRIAL CYAN TERMINAL
                </button>
                <button type="button" id="theme-btn-amethyst" class="theme-opt-btn" onclick="switchActiveThemeSheet('amethyst')">
                    ○ MIDNIGHT AMETHYST AXIS
                </button>
                <!-- NEW THEME CONFIGURATION TRIGGER BUTTON LINK -->
                <button type="button" id="theme-btn-matrix" class="theme-opt-btn" onclick="switchActiveThemeSheet('matrix')">
                    ○ MATRIX REVOLUTION CODE
                </button>
            </div>
        </div>

    </div>

    <!-- MAIN INTERFACE HEADER -->
    <header>
        <div class="top-row">
            <div class="logo">⚡ MEMPALACE // CORE.VIEW</div>
            <div class="controls-wrapper">
                <div class="search-container">
                    <input type="text" id="search" placeholder="Search indices... [/]" autocomplete="off">
                    <div id="search-nav" class="navigator-deck">
                        <span id="nav-count" class="nav-stats">0/0</span>
                        <button type="button" class="nav-arrow-btn" onclick="shiftHighlightTarget(-1)">▲</button>
                        <button type="button" class="nav-arrow-btn" onclick="shiftHighlightTarget(1)">▼</button>
                    </div>
                </div>
                <button type="button" class="menu-btn" onclick="toggleSidebarMenu(true)">⚙️ MENU</button>
            </div>
        </div>
        <div id="tab-bar" class="tab-bar"></div>
        <div id="section-bar" class="section-bar"></div>
    </header>

    <!-- CENTRAL WORKSPACE -->
    <main class="container" id="main-scroll-container">
        <div class="matrix-grid" id="card-grid"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
